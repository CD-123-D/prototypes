<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>3D Icons menu</title>
<!--
  3D Icons prototype (CD, 2026-11-27): Preschool 3D menu from Rive (menu_3d.riv, artboard menu_bar)
  on top of the bg_home background. Rive does the menu logic, motion and sounds; this page only
  places it (layout fit = full width), adds the native-like top shadow and the bottom safe area.
-->
<style>
  /* ---------- values (tune in feedback) ---------- */
  :root {
    --shadow: 0 -4px 24px rgba(58, 46, 40, .10);   /* Figma: Y −4, blur 24, #3A2E28 10 % */
    --safe-bottom: env(safe-area-inset-bottom, 0px); /* index.html sets it for the Mac preview */
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  .bg { flex: 1; min-height: 0; background: #fff url(assets/bg_home.png) center / cover no-repeat; }
  /* Tighter bar (CD, 2026-11-27 test): icons may sit SAFE_OVERLAP px inside the bottom safe area */
  .menu { flex: none; position: relative; background: #fff; box-shadow: var(--shadow);
          padding-bottom: max(0px, calc(var(--safe-bottom) - var(--safe-overlap, 16px))); }
  .clip { overflow: hidden; }
  canvas { display: block; width: 100%; }
</style>
</head>
<body>
<div class="bg"></div>
<div class="menu"><div class="clip" id="clip"><canvas id="menu"></canvas></div></div>

<script src="assets/runtime/rive.js"></script>
<script>
const RIV = 'assets/menu_3d.riv', ARTBOARD = 'menu_bar', SM = 'SMmenuBar';

const q = new URLSearchParams(location.search);
if (q.has('sa')) document.documentElement.style.setProperty('--safe-bottom', (+q.get('sa') || 0) + 'px');

rive.RuntimeLoader.setWasmUrl('assets/runtime/rive.wasm');
const canvas = document.getElementById('menu');

// Bar height from the Rive layout (dev note): slot = 20 % of width (72–128),
// icon = 76 % of slot (56–96), height ≈ 1.8 % of width + icon + 8.
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function barHeight(w) { return 0.018 * w + iconSize(w) + 8; }

// Phone in landscape (height < 480 = "compact height", Breakpoints draft): the width alone
// would give tablet icons (96) on a 390-high screen. Scale the whole Rive layout down
// so the icons keep phone size (~60).
const COMPACT_HEIGHT = 480, PHONE_ICON = 60;
function scaleFactor() {
  if (innerHeight >= COMPACT_HEIGHT) return 1;
  let s = 1;
  for (let i = 0; i < 4; i++) s = Math.min(1, PHONE_ICON / iconSize(innerWidth / s));
  return s;
}
function iconSize(w) { return clamp(0.76 * clamp(0.2 * w, 72, 128), 56, 96); }

// Top white above the icons: the .riv pads 1.8 % of the width (~15 on a phone in landscape).
// Test: cut it to TOP_PAD by hiding the extra top of the canvas (if CD likes it → fixed padding in Rive).
const TOP_PAD = 8;
const clip = document.getElementById('clip');

let r = null, soundVM = null;
function size() {
  const s = scaleFactor();
  const h = Math.round(barHeight(innerWidth / s) * s);
  const cut = Math.max(0, Math.round(0.018 * innerWidth - TOP_PAD));
  canvas.style.height = h + 'px';
  canvas.style.marginTop = -cut + 'px';
  clip.style.height = (h - cut) + 'px';
  if (r) { r.layout = new rive.Layout({ fit: rive.Fit.Layout, layoutScaleFactor: s }); r.resizeDrawingSurfaceToCanvas(); }
}
size();

r = new rive.Rive({
  src: RIV, canvas, artboard: ARTBOARD, stateMachines: SM, autoplay: true, autoBind: true,
  layout: new rive.Layout({ fit: rive.Fit.Layout, layoutScaleFactor: scaleFactor() }),
  onLoad: () => {
    r.resizeDrawingSurfaceToCanvas();
    const vm = r.viewModelInstance;
    soundVM = vm && vm.boolean('soundOn');
    const sel = vm && vm.enum('selected');
    if (sel) sel.on(() => parent.postMessage({ selected: sel.value }, '*'));
    parent.postMessage({ ready: true, selected: sel && sel.value }, '*');
  }
});

addEventListener('resize', size);
// Mac preview: Sound on / off button (the parents' switch `soundOn`)
addEventListener('message', e => {
  if (e.data && 'soundOn' in e.data && soundVM) soundVM.value = !!e.data.soundOn;
});
</script>
</body>
</html>
